name: Leeder sandbox migration

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the reviewed migration to leeder-sandbox (leave false for dry-run only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    environment: leeder-sandbox
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.LEEDER_SANDBOX_DB_PASSWORD }}
      PROJECT_REF: dwhtomnsuyveocrrmsnw
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: "2"

      - name: Initialize Supabase project configuration if missing
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Link only the sandbox project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Preview pending migrations (no database changes)
        run: supabase db push --linked --dry-run

      - name: Apply migrations to leeder-sandbox only
        if: ${{ inputs.apply == true }}
        run: supabase db push --linked --yes
