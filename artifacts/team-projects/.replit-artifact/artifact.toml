kind = "web"
previewPath = "/"
title = "Leeder"
description = "An experimental front-end prototype for Algerian universities to explore graduation research proposals, review workflows, and academic writing."
version = "1.0.0"
id = "artifacts/team-projects"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20650

[services.development]
run = "pnpm --filter @workspace/team-projects run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/team-projects", "run", "build" ]
serve = "static"
publicDir = "artifacts/team-projects/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20650"
BASE_PATH = "/"
